services:
  - type: web
    name: portfolio-backend
    runtime: node
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: mongo_url
        sync: false
    healthCheckPath: /api/portfolio/health
